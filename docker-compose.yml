version: "3.8"

# Ficiber Analytics - stack de servicios (laboratorio academico, empresa ficticia)

services:
  api:
    image: ficiber/api:1.8.2
    env_file: config/production.env
    ports: ["3000:3000"]
    depends_on: [postgres, redis]

  web:
    image: ficiber/web:1.8.2
    ports: ["8080:80"]

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ficiber_prod
      POSTGRES_USER: ficiber_app
      POSTGRES_PASSWORD: Pg_7h!xQ2r

  redis:
    image: redis:6

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    command: start
    environment:
      KC_HOSTNAME: sso.ficiber.com

  grafana:
    image: grafana/grafana:8.3.0
    ports: ["3001:3000"]

  nginx:
    image: nginx:1.18.0
    ports: ["80:80", "443:443"]
